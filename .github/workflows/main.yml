name: Build APoseFix

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup XMake
      uses: xmake-io/github-action-setup-xmake@v1

    - name: Configure
      run: xmake config --plat=windows --arch=x64 --mode=release -y

    - name: Install dependencies
      run: xmake require -y

    - name: Build
      run: xmake build

    - name: Upload DLL
      uses: actions/upload-artifact@v4
      with:
        name: APoseFix
        path: build/windows/x64/release/APoseFix.dll
